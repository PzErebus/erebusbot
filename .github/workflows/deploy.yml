name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-erebusbot
  cancel-in-progress: false

jobs:
  verify:
    name: 类型检查 + 单元测试
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Unit & integration tests
        run: npm test

  # 部署刻意留在本地：github.com 上的 token 权限面比本地宽，push 即上线一旦误推就直接打到生产。
  # 上线用 `npx wrangler deploy`（需先 `wrangler secret put` 维护 secret，并用 triggers deploy 应用路由）。
