name = "erebusbot"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# 必须显式开启，否则 wrangler triggers deploy 会默认关掉 workers.dev 路由
workers_dev = true

# 自定义域名路由（需 wrangler triggers deploy 应用）
# 目的：Telegram 拒绝把 webhook 指向 *.workers.dev，必须走自有域名
# 注意：bot.erebus.de5.net 已被另一个「智能反代」站点占用，此处不能用
# DNS 侧已由 Cloudflare 建好 *.erebusbot.erebus.de5.net -> Worker erebusbot，
# 但仅有 DNS 记录不会路由，必须在此声明 Route，否则请求落到 CDN 返回 404 Node not found。
# 显式声明精确主机 + 通配子域两条，避免 Cloudflare 对 `*.host` 是否匹配 `host` 的差异。
# 注意：routes 是顶层键，必须放在任何 [[table]] 头之前，否则会被归进上一个表（如 d1_databases）而被忽略。
routes = [
  { pattern = "erebusbot.erebus.de5.net/*", zone_name = "erebus.de5.net" },
  { pattern = "*.erebusbot.erebus.de5.net/*", zone_name = "erebus.de5.net" }
]

[vars]
LANGUAGE = "zh_CN"
# 轮询间隔（毫秒），5s~60s。DO alarm 精度到秒级；周期已收敛为 interval 本身（不再叠加长轮询耗时），
# 10s 对应响应延迟 0~10s，均值 ~5s。原来靠 1 分钟 Cron 最坏 60s。
# 注意：不要小于 5s，getUpdates 的 timeout 会自动取 interval-2，太密只会白烧 alarm/D1 配额。
POLL_INTERVAL_MS = 10000

# Secrets（通过 Cloudflare Dashboard 或 wrangler secret put 设置）
# BOT_TOKEN       - 从 @BotFather 获取的 Bot Token
# ADMIN_USER_ID   - 管理员 Telegram 用户 ID（支持多管理员，逗号分隔）
# SILICONFLOW_API_KEY - SiliconFlow API 密钥（用于AI广告检测）

# D1 数据库配置
# 2026-10-01 迁移：旧库 cf-pm-bot 主库在美西 SJC（每查询 ~200ms 跨洋 RTT），
# 新库建在 APAC（主库 SIN 新加坡），单查询 RTT 降到 ~20ms。旧库保留用于回滚。
[[d1_databases]]
binding = "BOT_D1"
database_name = "cf-pm-bot-apac"
database_id = "194f44ec-9a65-4fd0-bd11-dd1815229a58"

# 轮询触发器（替代 webhook）
# Telegram 不接受解析到 198.18.0.0/15（CF 保留 anycast 段）的 webhook 地址，
# 因此改由 Cron 每分钟调 /cron/poll 走 getUpdates 拉消息。
# 最小粒度为 1 分钟，实测延迟约 1 分钟
[triggers]
crons = ["*/1 * * * *"]

# 高频轮询由 PollerDO 的 alarm 驱动（Cron 最小粒度 1 分钟，延迟太大）。
# 这里的 crons 只当看门狗：每分钟唤醒 DO 对齐闹钟；DO 失效时兜底轮询一次。
[[migrations]]
tag = "v2_poller"
new_sqlite_classes = ["PollerDO"]

[[durable_objects.bindings]]
name = "POLLER"
class_name = "PollerDO"
